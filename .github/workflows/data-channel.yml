name: Refresh game data
on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/data/editorial-guides.json'
      - 'app/data/community-guides.json'
      - 'app/data/recommendation-rules.json'

permissions:
  contents: write
concurrency:
  group: publish-data-v1
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data-v1
          path: channel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check upstream and validate changed data
        run: python3 source/scripts/refresh-channel.py channel
      - name: Publish new data
        working-directory: channel
        run: |
          git add -- manifest.json '*.json.gz'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh game data $(jq -r .revision manifest.json)"
          git push origin HEAD:data-v1
