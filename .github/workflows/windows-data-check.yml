name: Verify Windows data updates
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/data-updates.test.mjs
      - run: npm run package:win
      - name: Upgrade the packaged EXE and relaunch it offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = gh api -H 'Accept: application/vnd.github.raw+json' 'repos/${{ github.repository }}/contents/manifest.json?ref=data-v1' | Out-String | ConvertFrom-Json
          $env:HEX_MIN_DATA_REVISION = $manifest.revision
          node tests/data-updates.e2e.mjs release/HexCompanion-win32-x64/HexCompanion.exe
